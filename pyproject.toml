[project]
name = "data-removal"
version = "0.1.0"
description = "CLI tool for removing personal data from broker sites"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40", "playwright-stealth>=2.0"]
pdf = ["fpdf2>=2.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
dr = "dataremoval.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # E501: line length handled by formatter; B008: typer uses function calls as defaults

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
